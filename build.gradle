plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
}

test {
    useJUnitPlatform()
}

jar {
    manifest.attributes(['Main-Class': 'com.example.HelloWorld.HelloWorld'])
    archiveFileName.set('runnable.jar')
}
